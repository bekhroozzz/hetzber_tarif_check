name: Hetzner CX33 Monitor

# Free scheduled monitoring via GitHub Actions.
# Runs a single availability check on a cron schedule and notifies via Telegram.
# No VPS required.

on:
  schedule:
    # Every 5 minutes (the minimum interval GitHub cron allows).
    # Note: GitHub may delay scheduled runs during high load.
    - cron: "*/5 * * * *"
  # Allows running the check manually from the Actions tab.
  workflow_dispatch:

# Avoid overlapping runs if a previous one is still going.
concurrency:
  group: hetzner-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore previous state
        uses: actions/cache/restore@v5
        with:
          path: .state
          key: hetzner-state-${{ github.run_id }}
          restore-keys: |
            hetzner-state-

      - name: Run availability check
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Read from repository Variables first, then Secrets, then default.
          # This works whether you configured them as Variables or Secrets.
          SERVER_TYPES: ${{ vars.SERVER_TYPES || secrets.SERVER_TYPES || 'cx33' }}
          LOCATIONS: ${{ vars.LOCATIONS || secrets.LOCATIONS || 'fsn1,nbg1,hel1' }}
          RUN_ONCE: "true"
          STATE_FILE: ".state/state.json"
        run: npx ts-node src/index.ts

      - name: Save state
        # Persist the "already notified" state so Telegram fires only once
        # per availability episode, even across separate scheduled runs.
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .state
          key: hetzner-state-${{ github.run_id }}
